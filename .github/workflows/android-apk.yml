name: Freedom Diffusion Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/android-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build stable-diffusion.cpp ARM64 CPU
        run: |
          set -euxo pipefail
          git clone https://github.com/leejet/stable-diffusion.cpp.git native-sd
          cd native-sd
          git checkout a3c49b13be5a64a0b4da2b576af3a17e8ae1ccbf
          git submodule update --init --recursive --depth 1
          cd ..
          cmake -S native-sd -B native-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF
          cmake --build native-build --target sd-cli --parallel 2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native-build/bin/sd-cli app/src/main/jniLibs/arm64-v8a/libsd.so
          test -s app/src/main/jniLibs/arm64-v8a/libsd.so
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreedomDiffusion-arm64-alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
